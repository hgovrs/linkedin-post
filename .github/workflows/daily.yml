name: Daily edition

on:
  schedule:
    - cron: "7,37 9-23 * * *" # twice an hour from 06:07 to 20:37 in São Paulo (UTC−3)
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal run; dry-run = no Zernio writes or state changes; ping = only check Copilot access"
        type: choice
        default: run
        options: [run, dry-run, ping]

permissions: {}

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    if: github.repository == 'hgovrs/linkedin-post'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Opus 5.5 at max effort can take minutes per turn (up to 5 turns + reviews)
    environment: linkedin
    permissions:
      contents: read
      copilot-requests: write
    env:
      MODE: ${{ inputs.mode || 'run' }}
      DRY: ${{ inputs.mode == 'dry-run' && '--dry-run' || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Ping Copilot
        if: env.MODE == 'ping'
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python daily.py ping

      # plan needs only the standard library, so idle runs take seconds
      - name: Plan (Zernio key only)
        id: plan
        if: env.MODE != 'ping'
        env:
          LINKEDIN_ZERNIO_API_KEY: ${{ secrets.LINKEDIN_ZERNIO_API_KEY }}
        run: python daily.py plan $DRY

      - name: Install dependencies
        if: steps.plan.outputs.action == 'write' || steps.plan.outputs.action == 'schedule' || steps.plan.outputs.refresh == 'yes'
        run: python -m pip install --quiet -r requirements.txt

      # Copilot writes, the GIF is rendered and audited, a second Copilot session reviews facts and scenes
      - name: Write and review with Copilot (no Zernio key)
        id: write
        if: steps.plan.outputs.action == 'write'
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: python daily.py write $DRY

      - name: Render GIFs (no secrets)
        if: steps.plan.outputs.action == 'schedule' || steps.write.outputs.action == 'schedule' || steps.plan.outputs.refresh == 'yes'
        run: python daily.py render

      # Schedules the new post and re-uploads scheduled posts whose template or text changed
      - name: Schedule on LinkedIn (Zernio key only)
        if: steps.plan.outputs.action == 'schedule' || steps.write.outputs.action == 'schedule' || steps.plan.outputs.refresh == 'yes'
        env:
          LINKEDIN_ZERNIO_API_KEY: ${{ secrets.LINKEDIN_ZERNIO_API_KEY }}
        run: python daily.py schedule $DRY

      - name: Keep the GIFs, stills and review
        if: always() && hashFiles('issues/*/dist/*.gif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: edition
          include-hidden-files: true
          path: |
            issues/*/dist/*.gif
            issues/*/dist/*.png
            issues/*/spec.json
            issues/*/caption.txt
            issues/*/meta.json
            .work/plan.json
            .work/review.json
          retention-days: 14

      - name: Hand the state to the save job
        if: always() && env.MODE == 'run' && steps.plan.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: |
            state.json
            issues/*/spec.json
            issues/*/caption.txt
            issues/*/meta.json
          retention-days: 3

  # Only this job can push, and it never sees a secret or calls Copilot.
  save:
    needs: edition
    if: always() && (inputs.mode || 'run') == 'run' && needs.edition.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: state
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: state
          path: .
      - name: Commit state
        if: steps.state.outcome == 'success'
        run: |
          git add state.json issues
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Update edition state"
          git pull --rebase --quiet
          git push --quiet
